<!DOCTYPE html>

<html>

<head>

<title>Pre-Order Form</title>

</head>

<body>



<h1>Pre-Order Form</h1>

<p>Please answer this form so we know who to contact.</p>





<form action="/action_page.php" method="get">

  <fieldset>

    <legend>Contact Info</legend>

    

    <p>

       <label for="name2">Full Name:</label>

       <input id="name2" name="name2" type="text" required>

    </p>

    

   

     <p>

<label for="Number1">Phone Number:</label>

       <input id="Number1" name="Number1" type="text" required>

      </p>

      <p>

       <label for="email2">Email:</label>

       <input id="email2" name="email2"   type="text" required>

     </p>



    <label for="Ship">Method of Shipping:</label>

    <select id="Ship" name="Ship">

      <option value="Ship1">Standard Shipping</option>

      <option value="Ship2">Express Delivery</option>

      <option value="Ship3">Next-Day Delivery</option>

     </select>



   </fieldset>

<button type="submit">Submit</button>

<button type="reset">Reset</button>

  

   

</form>



</body>

</html>
